name: Software checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and knowledge base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AccessibleBeautyAgent
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AccessibleBeautyAgent/backend/requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-lock.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run backend tests
        run: python -m pytest -ra
      - name: Validate knowledge base
        run: python scripts/validate_kb.py
      - name: Verify runtime without optional voice assets
        run: python scripts/verify_runtime.py --missing-voice

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AccessibleBeautyAgent/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: AccessibleBeautyAgent/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
